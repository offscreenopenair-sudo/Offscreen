<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <title>Deine Eintrittskarte</title>
  <link rel="icon" href="assets/logo/offscreen-icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/logo/offscreen-icon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap narrow">
      <a class="brand" href="index.html"><img class="wordmark" src="assets/logo/offscreen-logo-weiss.png" alt="Offscreen"></a>
    </div>
  </header>
  <main class="wrap narrow" style="padding-block:1rem 3rem">
    <div id="ticket"></div>
    <div id="error" class="msg bad" role="alert" hidden></div>
    <p class="note" style="text-align:center">Tipp: Mach einen Screenshot oder setz ein Lesezeichen, dann hast du die Karte am Einlass sofort griffbereit.</p>
  </main>
  <footer>
    <div class="wrap narrow">
      <span data-event="veranstalter"></span>
      <nav aria-label="Rechtliches"><a data-link="impressumUrl" href="#">Impressum</a><a data-link="datenschutzUrl" href="#">Datenschutz</a></nav>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    (async () => {
      const { E, api, parseTicketId, renderTicket, fillEventFields } = App;
      fillEventFields();
      document.title = "Eintrittskarte · " + E.name;
      const el = document.getElementById("ticket");
      const err = document.getElementById("error");
      const id = parseTicketId(new URLSearchParams(location.search).get("id"));
      if (!id) {
        err.textContent = "Dieser Link enthält keine gültige Ticket-Nummer. Bitte nutze den Link aus deiner Bestätigungs-E-Mail.";
        err.hidden = false;
        return;
      }
      // QR-Code sofort zeigen, auch wenn der Server langsam oder offline ist
      renderTicket(el, { id });
      const res = await api("ticket", { id });
      if (res.ok) renderTicket(el, { id, ...res });
      else if (res.error === "not_found") {
        el.innerHTML = "";
        err.textContent = "Dieses Ticket ist nicht bekannt. Bitte prüf den Link oder melde dich neu an.";
        err.hidden = false;
      }
    })();
  </script>
</body>
</html>
